<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mado README GIF</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=block">
<style>
  body { margin: 0; background: #F3F1EA; }
  canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1600" height="840"></canvas>
<script>
// The README's moving picture, drawn as emaki.lol draws Emaki's: hairlines on
// warm paper, each window a pale wash of its color with an edge of it, a
// serif title and an italic serif line beside a mono one. Laid out in a
// 1920 by 1008 box and drawn at the canvas's size. `frame(i)` draws frame i
// at FPS and returns it as a PNG; `ready` waits for the faces and the icon.
// scripts/make-readme-gif.sh renders every frame and makes the GIF.

const FPS = 30, LENGTH = 12;   // seconds, looped
const W = 1920, H = 1008;
const PAPER = '#F3F1EA', SHEET = '#F8F6F0', INK = '#1F1E1D', MUTED = '#77746B', LINE = '#8E8A80';
const ORCHID = '#845293', LILAC = '#C498D2';
const SAGE = '#578F63', SLATE = '#4489AE';
const SERIF = '"Source Serif 4", "Source Serif Pro", Georgia, serif';
const MONO = '"JetBrains Mono", Menlo, monospace';
const KEYS = 'system-ui, -apple-system, sans-serif';
const CJK = '"Songti SC", "LXGW WenKai", serif';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const icon = new Image();
// From a file the icon would taint the canvas, and no frame could be read
// back: the renderer hands it in as data (ICON).
icon.src = window.ICON || '../../crates/mado-app/assets/icon/icon-256.png';

window.ready = Promise.all([
  document.fonts.load(`600 84px ${SERIF}`), document.fonts.load(`400 52px ${SERIF}`),
  document.fonts.load(`italic 400 34px ${SERIF}`), document.fonts.load(`400 30px ${MONO}`),
  new Promise(r => { if (icon.complete) r(); else { icon.onload = r; icon.onerror = r; } }),
]);

// ---------------------------------------------------------------------------
// Easing: macOS tiling's curve for a window put in place (Mado's own, 350 ms),
// the studio's ease out quint for the footprint, and an ease in and out for
// the pointer.
// ---------------------------------------------------------------------------
function bezier(x1, y1, x2, y2) {
  const a = (p1, p2) => 1 - 3 * p2 + 3 * p1, b = (p1, p2) => 3 * p2 - 6 * p1, c = p1 => 3 * p1;
  const at = (t, p1, p2) => ((a(p1, p2) * t + b(p1, p2)) * t + c(p1)) * t;
  const slope = (t, p1, p2) => 3 * a(p1, p2) * t * t + 2 * b(p1, p2) * t + c(p1);
  return x => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) { const s = slope(t, x1, x2); if (Math.abs(s) < 1e-6) break; t -= (at(t, x1, x2) - x) / s; }
    return at(Math.min(1, Math.max(0, t)), y1, y2);
  };
}
const TILE = bezier(0.3, 1, 0.3, 1), QUINT = bezier(0.23, 1, 0.32, 1), INOUT = bezier(0.45, 0, 0.25, 1);
const clamp01 = v => Math.min(1, Math.max(0, v));
const span = (t, t0, d) => clamp01((t - t0) / d);
const mix = (a, b, k) => a + (b - a) * k;
const mixR = (a, b, k) => ({ x: mix(a.x, b.x, k), y: mix(a.y, b.y, k), w: mix(a.w, b.w, k), h: mix(a.h, b.h, k) });
const mixP = (a, b, k) => ({ x: mix(a.x, b.x, k), y: mix(a.y, b.y, k) });

// ---------------------------------------------------------------------------
// The stage: a screen with its menu bar, the part a window may use under it,
// and the two windows' places.
// ---------------------------------------------------------------------------
const S = { x: 86, y: 330, w: 960, h: 600, r: 24, bar: 36 };
const A = { x: S.x + 12, y: S.y + S.bar + 12, w: S.w - 24, h: S.h - S.bar - 24 };
const LEFT = { x: A.x, y: A.y, w: A.w / 2, h: A.h };
const RIGHT = { x: A.x + A.w / 2, y: A.y, w: A.w / 2, h: A.h };
const CORNER = { x: A.x, y: A.y, w: A.w / 2, h: A.h / 2 };
const NOTES0 = { x: 470, y: 480, w: 420, h: 300 };    // sage, in front at first
const WEB0 = { x: 200, y: 420, w: 480, h: 330 };      // slate, behind it

// The script, in seconds. Each window's frame is worked out from it for any
// moment, so a frame can be drawn on its own.
const T = {
  left: 1.0,            // ⌃⌥←: the notes to the left half
  clickWeb: 2.9,        // a click brings the browser forward
  right: 3.4,           // ⌃⌥→: the browser to the right half
  grab1: 5.0, away1: 5.12, corner1: 6.0, drop1: 6.7,   // the notes dragged away, to the top left corner
  grab2: 7.7, away2: 7.82, top2: 8.7, drop2: 9.4,      // the browser dragged away, to the top edge
  reset: 10.9,          // both back where they began, for the loop
};
const MOVE = 0.35;      // a window carried to its place
const GROW = 0.28;      // the footprint growing from the window

// Where the pointer is: a list of stops, each [time, point, held].
const P = (x, y) => ({ x, y });
const GRAB1 = P(LEFT.x + 110, LEFT.y + 17), AWAY1 = P(330, 470), CORNER1 = P(A.x + 8, A.y + 6);
const GRAB2 = P(RIGHT.x + 210, RIGHT.y + 17), AWAY2 = P(760, 470), TOP2 = P(560, A.y + 4);
const WEBSTRIP = P(632, 640);
const STOPS = [
  [0, P(1000, 860)], [2.3, P(1000, 860)], [2.85, WEBSTRIP], [4.3, WEBSTRIP], [4.95, GRAB1],
  [5.35, AWAY1], [5.95, CORNER1], [6.7, CORNER1], [7.1, P(560, 640)], [7.65, GRAB2],
  [8.05, AWAY2], [8.65, TOP2], [9.4, TOP2], [10.2, P(1000, 860)], [LENGTH, P(1000, 860)],
];
function pointer(t) {
  for (let i = 1; i < STOPS.length; i++) {
    const [t0, p0] = STOPS[i - 1], [t1, p1] = STOPS[i];
    if (t <= t1) return mixP(p0, p1, INOUT(span(t, t0, t1 - t0)));
  }
  return STOPS[STOPS.length - 1][1];
}
const holding = t => (t >= T.grab1 && t < T.drop1) || (t >= T.grab2 && t < T.drop2);

// A window held and moved less than AWAY keeps its place's size and goes
// with the pointer.
function held(placed, grab, at) {
  return { x: placed.x + at.x - grab.x, y: Math.max(A.y, placed.y + at.y - grab.y), w: placed.w, h: placed.h };
}

// A window dragged away from where Mado put it takes back its own size,
// still under the pointer at the point it was held by (Memory::dragged).
function dragged(placed, size, grab, at) {
  const ox = Math.min(grab.x - placed.x, size.w - 32), oy = grab.y - placed.y;
  // Kept on the screen, so the picture shows the whole window.
  const x = Math.min(Math.max(A.x, at.x - ox), A.x + A.w - size.w);
  return { x, y: Math.max(A.y, at.y - oy), w: size.w, h: size.h };
}

function notes(t) {
  if (t < T.left) return NOTES0;
  if (t < T.grab1) return mixR(NOTES0, LEFT, TILE(span(t, T.left, MOVE)));
  if (t < T.away1) return held(LEFT, GRAB1, pointer(t));
  if (t < T.drop1) return dragged(LEFT, NOTES0, GRAB1, pointer(t));
  const from = dragged(LEFT, NOTES0, GRAB1, CORNER1);
  if (t < T.reset + DIP) return mixR(from, CORNER, TILE(span(t, T.drop1, MOVE)));
  return NOTES0;
}
function web(t) {
  if (t < T.right) return WEB0;
  if (t < T.grab2) return mixR(WEB0, RIGHT, TILE(span(t, T.right, MOVE)));
  if (t < T.away2) return held(RIGHT, GRAB2, pointer(t));
  if (t < T.drop2) return dragged(RIGHT, WEB0, GRAB2, pointer(t));
  const from = dragged(RIGHT, WEB0, GRAB2, TOP2);
  if (t < T.reset + DIP) return mixR(from, A, TILE(span(t, T.drop2, MOVE)));
  return WEB0;
}
// Which is in front: the notes, until the click on the browser; the notes
// again from its drag until the browser's.
const webInFront = t => (t >= T.clickWeb && t < T.grab1) || (t >= T.grab2 && t < T.reset + DIP);
// For the loop the windows dip out where they ended and come back where they
// began, so neither crosses the other.
const DIP = 0.35;
const windowsAlpha = t => t < T.reset ? 1 : t < T.reset + DIP ? 1 - span(t, T.reset, DIP) : span(t, T.reset + DIP, 0.45);

// The footprint: where the window will go, shown while it is held over an
// area, grown from the window's frame, faded out as it is let go.
function footprint(t) {
  const shows = [[T.corner1, T.drop1, CORNER, notes], [T.top2, T.drop2, A, web]];
  for (const [on, off, to, win] of shows) {
    if (t >= on && t < off + 0.16) {
      const from = win(on);
      const grow = QUINT(span(t, on, GROW));
      const alpha = t < off ? QUINT(span(t, on, GROW)) : 1 - QUINT(span(t, off, 0.16));
      return { r: mixR(from, to, grow), alpha };
    }
  }
  return null;
}

// ---------------------------------------------------------------------------
// The list at the right: each move, lit while it happens, kept a shade
// darker once it has.
// ---------------------------------------------------------------------------
const ROWS = [
  { keys: ['⌃', '⌥', '←'], says: 'the left half', on: [[T.left - 0.2, T.left + 1.3]] },
  { keys: ['⌃', '⌥', '→'], says: 'the right half', on: [[T.right - 0.2, T.right + 1.3]] },
  { word: 'drag away', says: 'its own size back', on: [[T.away1 - 0.15, T.corner1], [T.away2 - 0.15, T.top2]] },
  { word: 'drag to a corner', says: 'a quarter', on: [[T.corner1, T.drop1 + 0.6]] },
  { word: 'drag to the top', says: 'the whole screen', on: [[T.top2, T.drop2 + 0.9]] },
];
const pressed = (t, row) => row.keys && t >= row.on[0][0] + 0.2 && t < row.on[0][0] + 0.42;

// ---------------------------------------------------------------------------
// Drawing.
// ---------------------------------------------------------------------------
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function hex(c, a) {
  const n = parseInt(c.slice(1), 16);
  return `rgba(${n >> 16}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}
function hair(x1, y1, x2, y2, color, w = 1.6) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

function header() {
  if (icon.complete && icon.naturalWidth) ctx.drawImage(icon, 78, 66, 84, 84);
  ctx.fillStyle = INK; ctx.font = `400 54px ${SERIF}`; ctx.textBaseline = 'alphabetic';
  ctx.fillText('Mado', 182, 128);
  const w = ctx.measureText('Mado').width;
  ctx.fillStyle = MUTED; ctx.font = `400 46px ${CJK}`;
  ctx.fillText('窓', 182 + w + 26, 126);
  ctx.fillStyle = ORCHID; ctx.font = `400 30px ${MONO}`; ctx.textAlign = 'right';
  ctx.fillText('for macOS', W - 86, 120);
  ctx.textAlign = 'left';
  ctx.fillStyle = INK; ctx.font = `600 84px ${SERIF}`;
  ctx.fillText('Every window in its place', 82, 262);
}

// Mado's menu bar image: the half solid, where it was a faint frame, the
// arrow back.
function madoGlyph(x, y, k, color) {
  ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  ctx.strokeStyle = hex(color, 0.4); ctx.lineWidth = 1.3; rr(1.5, 2, 17, 14, 2.6); ctx.stroke();
  ctx.fillStyle = color; rr(1.5, 2, 9, 14, 2.6); ctx.fill();
  ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(16.4, 11.2); ctx.lineTo(13.1, 11.2); ctx.moveTo(14.8, 9.4); ctx.lineTo(13, 11.2); ctx.lineTo(14.8, 13); ctx.stroke();
  ctx.restore();
}

function screen() {
  rr(S.x, S.y, S.w, S.h, S.r); ctx.fillStyle = SHEET; ctx.fill();
  ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.stroke();
  hair(S.x + 2, S.y + S.bar, S.x + S.w - 2, S.y + S.bar, hex(LINE, 0.55), 1.4);
  // The menus at the left, as short lines; Mado's image and the clock at the right.
  let x = S.x + 28;
  for (const len of [16, 34, 26, 30, 44]) { hair(x, S.y + S.bar / 2, x + len, S.y + S.bar / 2, hex(LINE, 0.7), 2); x += len + 22; }
  madoGlyph(S.x + S.w - 168, S.y + 7, 1.2, ORCHID);
  hair(S.x + S.w - 112, S.y + S.bar / 2, S.x + S.w - 30, S.y + S.bar / 2, hex(LINE, 0.7), 2);
}

// A window as the site sketches one: a pale wash of its color, an edge of it,
// a title bar with three dots, its content in hairlines, its name in its
// color.
function windowSketch(r, color, kind, name) {
  const g = 4;   // drawn a little inside its frame, so two halves read as two
  const x = r.x + g, y = r.y + g, w = r.w - g * 2, h = r.h - g * 2;
  ctx.save();
  rr(S.x + 1, S.y + S.bar, S.w - 2, S.h - S.bar - 1, S.r); ctx.clip();
  rr(x, y, w, h, 14); ctx.fillStyle = SHEET; ctx.fill();
  ctx.fillStyle = hex(color, 0.09); ctx.fill();
  ctx.save(); rr(x, y, w, h, 14); ctx.clip();
  const bar = 34;
  hair(x, y + bar, x + w, y + bar, hex(color, 0.45), 1.4);
  ctx.fillStyle = hex(LINE, 0.9);
  for (const k of [0, 1, 2]) { ctx.beginPath(); ctx.arc(x + 20 + k * 15, y + bar / 2, 4, 0, Math.PI * 2); ctx.fill(); }
  const soft = hex(color, 0.4), faint = hex(LINE, 0.5);
  if (kind === 'web') {
    rr(x + Math.max(78, w * 0.3), y + 8, Math.min(w * 0.42, 220), 18, 9); ctx.strokeStyle = soft; ctx.lineWidth = 1.4; ctx.stroke();
    rr(x + 22, y + bar + 22, w - 44, Math.min(120, h * 0.32), 8); ctx.stroke();
    let ly = y + bar + 22 + Math.min(120, h * 0.32) + 30;
    for (const k of [0.82, 0.64, 0.74, 0.5]) { if (ly > y + h - 20) break; hair(x + 22, ly, x + 22 + (w - 44) * k, ly, faint); ly += 24; }
  } else {
    const side = Math.min(118, w * 0.3);
    hair(x + side, y + bar, x + side, y + h, hex(color, 0.35), 1.4);
    let sy = y + bar + 26;
    for (const k of [0.62, 0.48, 0.7]) { hair(x + 18, sy, x + 18 + (side - 36) * k, sy, soft, 2); sy += 26; }
    let ly = y + bar + 30;
    hair(x + side + 22, ly, x + side + 22 + (w - side - 44) * 0.5, ly, hex(color, 0.6), 2.4); ly += 32;
    for (const k of [0.9, 0.78, 0.86, 0.6, 0.82, 0.7, 0.88]) { if (ly > y + h - 20) break; hair(x + side + 22, ly, x + side + 22 + (w - side - 44) * k, ly, faint); ly += 24; }
  }
  ctx.fillStyle = color; ctx.font = `400 30px ${SERIF}`; ctx.textAlign = 'right';
  ctx.fillText(name, x + w - 22, y + h - 22);
  ctx.textAlign = 'left';
  ctx.restore();
  rr(x, y, w, h, 14); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

// The footprint: nearly clear, a breath of lilac and a hairline of it.
function drawFootprint(f) {
  if (!f) return;
  const g = 4, r = f.r;
  ctx.save(); ctx.globalAlpha = f.alpha;
  rr(r.x + g, r.y + g, r.w - g * 2, r.h - g * 2, 14);
  ctx.fillStyle = hex(LILAC, 0.11); ctx.fill();
  ctx.strokeStyle = hex(ORCHID, 0.5); ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}

// The Mac's arrow, black on a white halo.
function arrow(p, down) {
  ctx.save(); ctx.translate(p.x - 3, p.y - 3); const k = down ? 2.45 : 2.6; ctx.scale(k, k);
  ctx.beginPath();
  ctx.moveTo(1.5, 1.5); ctx.lineTo(1.5, 12.2); ctx.lineTo(4.1, 9.8); ctx.lineTo(6, 14); ctx.lineTo(7.9, 13.2); ctx.lineTo(6.1, 9.1); ctx.lineTo(9.6, 9.1); ctx.closePath();
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.fillStyle = '#111'; ctx.fill();
  ctx.restore();
}

function key(x, y, sym, lit, down) {
  const s = 46, dy = down ? 2 : 0;
  rr(x, y + dy, s, s, 9);
  ctx.fillStyle = down ? hex(LILAC, 0.35) : SHEET; ctx.fill();
  ctx.strokeStyle = lit ? ORCHID : hex(LINE, 0.9); ctx.lineWidth = lit ? 2 : 1.6; ctx.stroke();
  ctx.fillStyle = lit ? ORCHID : INK; ctx.font = `500 24px ${KEYS}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(sym, x + s / 2, y + s / 2 + dy + 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function list(t) {
  const X = 1150, Y0 = 410, STEP = 104;
  ROWS.forEach((row, i) => {
    const lit = row.on.some(([a, b]) => t >= a && t < b);
    const begun = t >= row.on[0][0] && t < T.reset;
    const fadeIn = t >= T.reset ? 1 - span(t, T.reset, 0.6) : 1;
    const alpha = lit ? 1 : begun ? 0.78 * fadeIn + 0.36 * (1 - fadeIn) : 0.36;
    ctx.save(); ctx.globalAlpha = alpha;
    const y = Y0 + i * STEP;
    if (row.keys) {
      row.keys.forEach((k, j) => key(X + j * 56, y - 34, k, lit, pressed(t, row)));
    } else {
      ctx.fillStyle = lit ? ORCHID : INK; ctx.font = `400 30px ${MONO}`;
      ctx.fillText(row.word, X, y);
    }
    ctx.fillStyle = lit ? INK : MUTED; ctx.font = `italic 400 34px ${SERIF}`;
    ctx.fillText(row.says, X + 330, y);
    ctx.restore();
  });
}

function draw(t) {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
  header();
  screen();
  const n = notes(t), w = web(t);
  const notesDrawn = () => windowSketch(n, SAGE, 'notes', 'Notes');
  const webDrawn = () => windowSketch(w, SLATE, 'web', 'Browser');
  ctx.save(); ctx.globalAlpha = windowsAlpha(t);
  if (webInFront(t)) { notesDrawn(); webDrawn(); } else { webDrawn(); notesDrawn(); }
  ctx.restore();
  drawFootprint(footprint(t));
  list(t);
  arrow(pointer(t), holding(t));
}

window.frame = i => { draw(i / FPS); return canvas.toDataURL('image/png'); };
window.FRAMES = FPS * LENGTH;
window.FPS = FPS;
window.ready.then(() => {
  // In a browser, the picture plays; the renderer draws frame by frame.
  if (!navigator.webdriver && !window.RENDERING) {
    const start = performance.now();
    const tick = now => { draw(((now - start) / 1000) % LENGTH); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
});
</script>
</body>
</html>
